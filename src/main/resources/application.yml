spring:
  # RabbitMQ 설정
  rabbitmq:
    host: localhost
    port: 5672
    username: gusetuser
    password: 1234
    listener:
      simple:
        retry:
          enabled: true     # 재시도 활성화
          initial-interval: 1000  # 첫 재시도 대기시간 1초
          max-attempts: 3   # 최대 재시도 횟수
          max-interval: 1000  # 시도간 최대 대기시간
        default-requeue-rejected: false # 재시도 실패 시 자동으로 DL
  application:
    name: HelloMessageQueue
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  # 데이터베이스
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 40
  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
  # 타임리프 설정
  thymeleaf:
    enabled: true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html

# JWT 설정
jwt:
  secretKey: dsaoiuxcjxzkjckxjcsakjksaeyhadkmcxnnbcmnvbcxnmvbcxnmvxuehfsdklfjdslk

# 로깅 설정
logging:
  level:
    org.hibernate.sql: debug
server:
  port: 8083
